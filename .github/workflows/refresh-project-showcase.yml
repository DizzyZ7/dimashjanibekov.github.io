name: Refresh project showcase

on:
  push:
    paths:
      - .github/workflows/refresh-project-showcase.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update portfolio projects
        run: python tools/refresh_project_showcase.py
      - name: Commit refreshed portfolio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refresh-project-showcase.yml tools/refresh_project_showcase.py
          git add index.html
          git commit -m "Curate strongest engineering projects"
          git push
