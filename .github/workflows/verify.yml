name: Verify portfolio
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check script.js
          node --check projects.js
          node --check cases/case.js
      - name: Verify portfolio content
        run: node verify-site.mjs
